name: '[Manual] Test Devnet'
on:
  workflow_dispatch:
    inputs:
      ignore-scripts:
        description: 'Ignore scripts'
        type: boolean
        default: false

jobs:
  tests:
    name: Run test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rpc-devnet
            USE_DEVNET: true

    uses: ./.github/workflows/_test.yml
    with:
      use-devnet: ${{ matrix.USE_DEVNET }}
      ignore-scripts: ${{ inputs.ignore-scripts }}
